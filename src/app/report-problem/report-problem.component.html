<div class="report-problem-bar">
  <span class="report-problem-prompt">See something that doesn't look right?</span>
  <a
    [href]="reportUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="report-problem-link"
    aria-label="Report a problem with this record, opens in a new tab"
  >
    Report a Problem
  </a>
</div>
